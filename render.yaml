services:
  - type: web
    name: krishisetu-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://krishisetu.vercel.app
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
        length: 32
      - key: GNANI_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: MAPTILER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
